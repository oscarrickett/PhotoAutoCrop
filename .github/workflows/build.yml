name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest    # Apple Silicon (M1/M2/M3/M4)
            label: macos-arm64
          - os: macos-13        # Last Intel-Mac runner image
            label: macos-x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6.0"

      - name: Build with PyInstaller
        run: python build.py

      - name: Zip macOS .app
        if: runner.os == 'macOS'
        working-directory: dist
        run: zip -ry PhotoAutoCrop-${{ matrix.label }}.zip PhotoAutoCrop.app

      - name: Rename Windows exe
        if: runner.os == 'Windows'
        working-directory: dist
        run: |
          Move-Item PhotoAutoCrop.exe PhotoAutoCrop-${{ matrix.label }}.exe
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoAutoCrop-${{ matrix.label }}
          path: |
            dist/PhotoAutoCrop-${{ matrix.label }}.exe
            dist/PhotoAutoCrop-${{ matrix.label }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/PhotoAutoCrop-*.exe
            artifacts/**/PhotoAutoCrop-*.zip
          generate_release_notes: true
